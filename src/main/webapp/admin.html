<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Sushi Talence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Administration</h1>
        <a href="index.html" class="espace-admin btn-retour">Voir Menu</a>
    </header>

    <div class="form-box">
        <h2>Ajouter un Sushi</h2>
        <form id="adminForm">
            <label>Nom:</label>
            <input type="text" name="nom" required>
            <label>Categorie:</label>
            <select name="categorie">
                <option>Maki</option>
                <option>Nigiri</option>
                <option>Sashimi</option>
            </select>
            <label>Prix (€):</label>
            <input type="number" step="0.01" name="prix" required>
            <label>URL Image:</label>
            <input type="text" name="image">
            <button type="submit" class="btn-commander">Sauvegarder</button>
        </form>
    </div>

    <div class="table-container">
        <h2>Commandes Recues</h2>
        <table>
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Adresse</th>
                    <th>Articles</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Lea Bartot</td>
                    <td>Talence, FR</td>
                    <td>2x Maki Saumon</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('adminForm').onsubmit = (e) => {
            e.preventDefault();
            const nom = e.target.nom.value;
            alert("Le produit " + nom + " a ete enregistre");
            e.target.reset();
        };
    </script>
</body>
</html>
