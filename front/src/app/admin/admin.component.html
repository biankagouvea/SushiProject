<header class="admin-header">
  <h1>Administration</h1>
  <div>
    <button (click)="allerAuMenu()">Voir Menu</button>
    <button (click)="seDeconnecter()" style="background-color: #dc3545; margin-left: 10px;">Déconnexion</button>
  </div>
</header>

<div class="admin-container">

  <div class="form-box">
    <h2>Ajouter un Sushi</h2>

    <form (submit)="ajouterSushi($event)">
      <label for="nom">Nom:</label>
      <input id="nom" type="text" name="nom" required>

      <label for="categorie">Catégorie:</label>
      <select id="categorie" name="categorie">
        <option>Maki</option>
        <option>Nigiri</option>
        <option>Sashimi</option>
      </select>

      <label for="prix">Prix (€):</label>
      <input id="prix" type="number" step="0.01" name="prix" required>

      <label for="image">URL Image:</label>
      <input id="image" type="text" name="image">

      <button type="submit" class="btn-commander">
        Sauvegarder
      </button>
    </form>
  </div>

  <div class="table-container">
    <h2>Commandes reçues</h2>

    <div *ngIf="chargementEnCours" style="text-align: center; color: #666;">
      Chargement des commandes...
    </div>

    <table *ngIf="commandes.length > 0 && !chargementEnCours; else aucuneCommande">
      <thead>
        <tr>
          <th>Client</th>
          <th>Adresse</th>
          <th>Articles</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let commande of commandes">
          <td>{{ commande.nomClient }}</td>
          <td>{{ commande.adresse }}</td>
          <td>
            <div *ngFor="let article of commande.items">
              {{ article.nom }} x {{ article.quantite }}
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #aucuneCommande>
      <p style="text-align: center; padding: 20px; color: #999;">
        Aucune commande pour le moment
      </p>
    </ng-template>
  </div>

</div>
